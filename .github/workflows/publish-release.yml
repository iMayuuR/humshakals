name: Publish verified desktop release

on:
  repository_dispatch:
    types: [humshakals_release_ready]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing public draft tag to verify and publish
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: public-release-${{ github.event.client_payload.tag || inputs.tag || github.run_id }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'iMayuuR/humshakals'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out public release policy only
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Test the release verifier
        run: node --test tests/verify-release.test.mjs

      - name: Verify draft and publish
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ github.event.client_payload.tag || inputs.tag }}
        run: |
          set -euo pipefail
          TAG="$REQUESTED_TAG"
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo '::error::Expected a stable vX.Y.Z tag.'; exit 1; }

          # The public tag must refer only to public landing/release infrastructure.
          git fetch --no-tags origin "refs/tags/$TAG:refs/tags/$TAG"
          git merge-base --is-ancestor "$TAG^{commit}" HEAD || { echo '::error::Public release tag is not on public master history.'; exit 1; }
          while IFS= read -r path; do
            case "$path" in
              README.md|docs/index.html|docs/styles.css|docs/script.js|docs/logo.png|docs/favicon.png|.github/workflows/publish-release.yml|scripts/verify-release.mjs|tests/verify-release.test.mjs) ;;
              *) echo "::error::Unexpected file in public release source archive: $path"; exit 1 ;;
            esac
          done < <(git ls-tree -r --name-only "$TAG")

          mkdir -p verification
          # GitHub's release-by-tag API can return 404 for an unpublished draft.
          # Resolve it from the authenticated release list, then fetch assets by ID.
          mapfile -t release_ids < <(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
            jq -r --arg tag "$TAG" '.[] | select(.tag_name == $tag and .draft == true) | .id')
          [[ ${#release_ids[@]} -eq 1 ]] || { echo '::error::Expected exactly one matching draft release.'; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/releases/${release_ids[0]}" > verification/release.json
          for name in SHA256SUMS.txt latest.yml latest-mac.yml; do
            asset_id="$(jq -r --arg name "$name" '.assets[] | select(.name == $name) | .id' verification/release.json)"
            [[ "$asset_id" =~ ^[0-9]+$ ]] || { echo "::error::Missing draft asset: $name"; exit 1; }
            curl --fail --silent --show-error --location \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'Accept: application/octet-stream' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" \
              --output "verification/$name"
          done
          node scripts/verify-release.mjs "$TAG" verification/release.json \
            verification/SHA256SUMS.txt verification/latest.yml verification/latest-mac.yml

          curl --fail --silent --show-error \
            --request PATCH \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'Content-Type: application/json' \
            --data '{"draft":false,"make_latest":"true"}' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/${release_ids[0]}" \
            --output verification/published.json
          jq -e --arg tag "$TAG" '.draft == false and .tag_name == $tag' verification/published.json >/dev/null
